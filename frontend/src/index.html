<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ocularr – Gotta grab ’em all</title>
    <link rel="canonical" href="https://ocularr.ink/" />
    <meta
      name="description"
      content="Ocularr is a manga and comic collection manager for Usenet and BitTorrent users, with plugin support. It watches RSS feeds for new chapters and issues of the series you follow, grabs them, sorts them and renames them."
    />
    <meta
      name="theme-color"
      content="#1b1e26"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#101217"
      media="(prefers-color-scheme: dark)"
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ocularr" />
    <meta property="og:url" content="https://ocularr.ink/" />
    <meta property="og:title" content="Ocularr" />
    <meta
      property="og:description"
      content="Ocularr is a manga and comic collection manager for Usenet and BitTorrent users, with plugin support. It watches RSS feeds for new chapters and issues of the series you follow, grabs them, sorts them and renames them."
    />
    <meta property="og:image" content="https://ocularr.ink/img/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/logo/ocularr.svg" />
    <link rel="icon" type="image/ico" href="/img/favicon.ico" />
    <link rel="apple-touch-icon" href="/logo/ocularr-256.png" />
    <script>
      (function () {
        var theme = null;

        try {
          theme = localStorage.getItem('theme');
        } catch (e) {}

        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }

        document.documentElement.setAttribute('data-theme', theme);

        if (window.location.hash.toLowerCase() === '#donate') {
          window.location.replace('https://opencollective.com/sonarr');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
